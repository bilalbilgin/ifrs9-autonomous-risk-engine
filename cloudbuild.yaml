steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ifrs9-risk-engine:$COMMIT_SHA', '.']

  # 2. Push Container to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ifrs9-risk-engine:$COMMIT_SHA']

  # 3. Deploy to Serverless Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ifrs9-risk-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ifrs9-risk-engine:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ifrs9-risk-engine:$COMMIT_SHA'