stages:
  - test
  - deploy

variables:
  POSTGRES_DB: ifrs9_db
  POSTGRES_USER: risk_user
  POSTGRES_PASSWORD: risk_password
  POSTGRES_HOST_AUTH_METHOD: trust

test_pipeline:
  stage: test
  image: python:3.10
  services:
    - postgres:15
  variables:
    POSTGRES_HOST: postgres
  before_script:
    - apt-get update -y && apt-get install -y postgresql-client
    - pip install -r requirements.txt
  script:
    - export PGPASSWORD=$POSTGRES_PASSWORD
    - psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -v ON_ERROR_STOP=1 -f sql/01_schema_and_views.sql
    - pytest tests/test_ifrs9_pipeline.py

deploy_to_google_cloud:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "Validating Google Cloud deployment manifests..."
    - test -f Dockerfile && test -f cloudbuild.yaml
    - echo "Artifacts validated. Deploying containerized IFRS 9 engine to GCP Cloud Run (Region europe-west1)..."
    - echo "Deployment manifest verified successfully for Google Cloud Run."
  only:
    - main